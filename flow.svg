<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 340" width="1800" height="340" role="img" aria-label="Horizontal flow from a new blog article to a LinkedIn post">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
    <filter id="card" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1800" height="340" rx="20" fill="#F8FAFC"/>
  <text x="36" y="42" fill="#0F172A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">One new article becomes one LinkedIn post</text>
  <text x="36" y="66" fill="#64748B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Read left to right. Publish waits until testMode is false.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#card)">
      <rect x="36" y="96" width="240" height="168" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <text x="156" y="132" fill="#2563EB" font-size="12" font-weight="700" letter-spacing="0.6">01  READ</text>
      <text x="156" y="168" fill="#0F172A" font-size="20" font-weight="700">Blog feed</text>
      <text x="156" y="196" fill="#475569" font-size="14">Pick up the newest</text>
      <text x="156" y="216" fill="#475569" font-size="14">article</text>
    </g>
    <g filter="url(#card)">
      <rect x="332" y="96" width="240" height="168" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
      <text x="452" y="132" fill="#D97706" font-size="12" font-weight="700" letter-spacing="0.6">02  SKIP</text>
      <text x="452" y="168" fill="#0F172A" font-size="20" font-weight="700">Google Sheet</text>
      <text x="452" y="196" fill="#475569" font-size="14">Stop if this link</text>
      <text x="452" y="216" fill="#475569" font-size="14">was already posted</text>
    </g>
    <g filter="url(#card)">
      <rect x="628" y="96" width="240" height="168" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
      <text x="748" y="132" fill="#7C3AED" font-size="12" font-weight="700" letter-spacing="0.6">03  WRITE</text>
      <text x="748" y="168" fill="#0F172A" font-size="20" font-weight="700">Caption</text>
      <text x="748" y="196" fill="#475569" font-size="14">Groq first, Gemini</text>
      <text x="748" y="216" fill="#475569" font-size="14">if Groq fails</text>
    </g>
    <g filter="url(#card)">
      <rect x="924" y="96" width="240" height="168" rx="16" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
      <text x="1044" y="132" fill="#DB2777" font-size="12" font-weight="700" letter-spacing="0.6">04  DRAW</text>
      <text x="1044" y="168" fill="#0F172A" font-size="20" font-weight="700">Illustration</text>
      <text x="1044" y="196" fill="#475569" font-size="14">Cloudflare draws</text>
      <text x="1044" y="216" fill="#475569" font-size="14">one image</text>
    </g>
    <g filter="url(#card)">
      <rect x="1220" y="96" width="240" height="168" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
      <text x="1340" y="132" fill="#0891B2" font-size="12" font-weight="700" letter-spacing="0.6">05  PREVIEW</text>
      <text x="1340" y="168" fill="#0F172A" font-size="20" font-weight="700">Check it</text>
      <text x="1340" y="196" fill="#475569" font-size="14">Read the caption</text>
      <text x="1340" y="216" fill="#475569" font-size="14">before anything posts</text>
    </g>
    <g filter="url(#card)">
      <rect x="1516" y="96" width="248" height="168" rx="16" fill="#F0FDF4" stroke="#059669" stroke-width="2.5"/>
      <text x="1640" y="132" fill="#059669" font-size="12" font-weight="700" letter-spacing="0.6">06  PUBLISH</text>
      <text x="1640" y="168" fill="#0F172A" font-size="20" font-weight="700">LinkedIn</text>
      <text x="1640" y="196" fill="#475569" font-size="14">Post, then save</text>
      <text x="1640" y="216" fill="#475569" font-size="14">the link in the sheet</text>
    </g>

    <path d="M276 180 H324" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M572 180 H620" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M868 180 H916" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1164 180 H1212" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1460 180 H1508" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>

  <text x="36" y="308" fill="#64748B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">The run ends on the preview while testMode is true. Set it to false in Prepare Blog Data when you want step 06 to post.</text>
</svg>
